# @format

name: 'Release Main'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run through beta/prod without pushing to main (verification only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop

      - name: Release promote
        # TODO: pin to a released tag of tomgrv/actions once its
        # multi-repo-consistency PR merges and tags (currently pointing at
        # the working branch until that lands).
        uses: tomgrv/actions/release-promote@claude/multi-repo-consistency-release-7se0jy
        with:
          # Bootstrap pin: this repo needs its own git-release-beta/
          # git-release-prod before any tag of this repo exists, so this
          # points at the exact commit that added them rather than a
          # branch. TODO: swap to the real tag once this release finishes.
          scripts-ref: 8610d99aac8d113058359686244d0fbb6c37d7e4
          dry-run: ${{ inputs.dry_run == true }}
