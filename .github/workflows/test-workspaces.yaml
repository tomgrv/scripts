# @format

name: Test workspaces

# A draft pull request only runs the workspaces its changes impact (the ones
# owning a changed file, and what depends on them - see
# .github/scripts/impacted-workspaces.sh); marking it ready for review, any push to
# a non-draft pull request and the long-lived branches run every workspace.
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request merge commit and its base-side parent, to diff them.
          fetch-depth: 2

      - name: Scope to the impacted workspaces (draft pull requests)
        id: scope
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: echo "filter=$(git diff --name-only HEAD^1 HEAD | .github/scripts/impacted-workspaces.sh)" >> "$GITHUB_OUTPUT"

      - name: List packages
        id: list
        uses: tomgrv/actions/list-packages@v4
        with:
          require-repository: 'false'
          filter: ${{ steps.scope.outputs.filter }}

  test:
    needs: list-packages
    if: needs.list-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.list-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run workspace tests
        uses: tomgrv/actions/run-workspace-tests@v4
        with:
          workspace: ${{ matrix.package.path }}

  repo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run repo-wide tests
        run: |
          if compgen -G "tests/*.bats" > /dev/null; then
            bats tests/
          else
            echo "No repo-wide tests under tests/, skipping."
          fi
